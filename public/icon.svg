<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8888cc"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="50%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#ff000000"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#333355" stroke-width="6"/>

  <!-- Stars -->
  <circle cx="80" cy="90" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="420" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="400" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="390" cy="360" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="250" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="450" cy="200" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="340" cy="440" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="180" cy="60" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="330" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="130" r="1" fill="#ffffff" opacity="0.9"/>

  <!-- Asteroid top-left -->
  <g transform="translate(110,140) rotate(-20)">
    <polygon points="0,-28 20,-18 30,-2 24,18 8,26 -14,22 -26,6 -22,-16"
             fill="none" stroke="#666688" stroke-width="3" opacity="0.7"/>
    <line x1="-10" y1="-10" x2="5" y2="2" stroke="#666688" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Asteroid bottom-right -->
  <g transform="translate(380,340) rotate(35)">
    <polygon points="0,-20 14,-14 22,0 16,16 4,20 -12,14 -18,2 -14,-12"
             fill="none" stroke="#666688" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Small asteroid fragment -->
  <g transform="translate(350,140) rotate(60)">
    <polygon points="0,-12 10,-4 8,8 -4,10 -10,2"
             fill="none" stroke="#666688" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Ship engine flame -->
  <g transform="translate(256,290)">
    <polygon points="-16,0 0,55 16,0" fill="url(#flame)" opacity="0.9"/>
    <polygon points="-8,0 0,35 8,0" fill="#ffee66" opacity="0.8"/>
  </g>

  <!-- Ship body (vector wireframe style) -->
  <g transform="translate(256,230)">
    <!-- Main hull -->
    <polygon points="0,-80 -40,40 -30,55 0,40 30,55 40,40"
             fill="url(#ship)" fill-opacity="0.15" stroke="url(#ship)" stroke-width="4"
             stroke-linejoin="round"/>
    <!-- Cockpit detail -->
    <polygon points="0,-50 -12,0 0,-8 12,0"
             fill="none" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <!-- Wing accents -->
    <line x1="-36" y1="44" x2="-20" y2="10" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="36" y1="44" x2="20" y2="10" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Bullet trail -->
  <g opacity="0.9">
    <rect x="253" y="80" width="6" height="24" rx="3" fill="#ffff00"/>
    <rect x="254" y="88" width="4" height="12" rx="2" fill="#ffffff"/>
  </g>
  <g opacity="0.5">
    <rect x="253" y="110" width="6" height="16" rx="3" fill="#ffff00"/>
  </g>

  <!-- Shield arc -->
  <path d="M 200,220 A 70,85 0 1,1 312,220" fill="none"
        stroke="url(#shield)" stroke-width="3" opacity="0.5"
        stroke-dasharray="8,6"/>

  <!-- Scanline overlay effect -->
  <g opacity="0.06">
    <line x1="6" y1="50" x2="506" y2="50" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="100" x2="506" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="150" x2="506" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="200" x2="506" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="250" x2="506" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="300" x2="506" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="350" x2="506" y2="350" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="400" x2="506" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="6" y1="450" x2="506" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
